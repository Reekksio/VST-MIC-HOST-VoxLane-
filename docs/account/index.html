<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>VoxLane account</title><link rel="stylesheet" href="style.css"><script src="account.js?v=4" defer></script></head>
<body><main><small>VOXLANE</small><h1 data-i18n="title">VoxLane account</h1>
<form id="email-action" hidden><div class="buttons"><button id="verify-email" type="submit" data-i18n="confirm">Confirm email</button><button id="email-action-cancel" type="button" data-i18n="back">Back</button></div></form>
<form id="account"><label><span data-i18n="email">Email</span><input id="email" type="email" autocomplete="email" required></label><label><span data-i18n="password">Password</span><input id="password" type="password" autocomplete="current-password" minlength="10" required></label><div class="buttons"><button type="submit" data-i18n="login">Log in</button><button type="button" id="signup" data-i18n="signup">Create account</button><button type="button" id="forgot" data-i18n="forgot">Forgot password?</button></div></form>
<form id="recovery" hidden><label><span data-i18n="newPassword">New password</span><input id="new-password" type="password" minlength="10" autocomplete="new-password" required></label><button data-i18n="save">Save</button></form>
<p id="status" role="status"></p><footer><span data-i18n="price">Pro · PLN 25 once</span><br><span data-i18n="paymentMode">Real payments via Stripe</span> · Beta 0.7</footer></main></body></html>
